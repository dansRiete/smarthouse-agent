apiVersion: v1
kind: ServiceAccount
metadata:
  name: smarthouse-agent-sa
  namespace: smarthouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: smarthouse
  name: smarthouse-agent-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smarthouse-agent-rolebinding
  namespace: smarthouse
subjects:
- kind: ServiceAccount
  name: smarthouse-agent-sa
  namespace: smarthouse
roleRef:
  kind: Role
  name: smarthouse-agent-role
  apiGroup: rbac.authorization.k8s.io
