name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/dansriete/smarthouse-agent
          docker build --no-cache -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: /home/alexkzk/.kube/config
        run: |
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/agent.yaml
          kubectl set image deployment/smarthouse-agent \
            smarthouse-agent=ghcr.io/dansriete/smarthouse-agent:${{ github.sha }} \
            -n smarthouse
          kubectl rollout status deployment/smarthouse-agent -n smarthouse --timeout=300s
